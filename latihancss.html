<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: rgba(47, 233, 171, 0.884);
            font-weight: 500;
        }
        .momo{
            font-style: italic;
            color: rgb(116, 92, 49); 
            font-weight: 500;
        }
        .chic{
            font-style: oblique;
            color:rgb(144, 245, 245);
            font-weight:600;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color: rgb(209, 31, 31);">adalah kalimat pertama.</p>
    <p> ini adalah kalimat kedua.</p>
    <p class="momo">adalah kalimat ketiga.</p>
    <p class="chic">adalah kalimat keempat.</p>
</body>
</html>
